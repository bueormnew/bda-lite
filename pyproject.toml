[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bda-lite"
version = "0.1.0"
description = "Fast, configurable BDA-Lite language models built on PyTorch SDPA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "tokenizers>=0.20", "tqdm>=4.66"]

[project.optional-dependencies]
train = ["datasets>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
